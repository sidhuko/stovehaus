name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled, so a run that is already
# publishing is never killed half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The brand audit gates the deploy. It checks 27 colour-contrast
      # assertions from the guidelines plus the built HTML for voice, unit
      # casing, logo minimum sizes, square corners and cascade-layer
      # regressions. It exits non-zero on any failure, so a page that breaks
      # the identity does not reach the domain.
      - name: Brand audit
        run: node scripts/audit-brand.mjs

      - name: Type check
        run: npx astro check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
